name: Isolated native CLI trial
on:
  workflow_dispatch:
    inputs:
      harness:
        type: choice
        options: [all, claude, codex, pi, kimi, cursor]
        default: all
      mode:
        type: choice
        options: [smoke, live, vendor]
        default: smoke
      model:
        type: string
        default: deepseek-v4-pro
      phase:
        type: choice
        options: [lobby, draft-lock, both]
        default: draft-lock
      series:
        type: string
        default: worlds-2026-main-event-quarterfinals-4
      limit:
        description: Maximum selected tasks per harness (blank for all)
        type: string
      game:
        type: string
        default: '2'
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          CLI: ${{ inputs.harness }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json,os
          cli,mode=os.environ['CLI'],os.environ['MODE']
          supported=['claude','codex','pi','kimi','cursor']
          assert cli=='all' or cli in supported
          if mode=='vendor': assert cli=='cursor'
          if mode=='live': assert cli!='cursor'
          selected=(supported[:4] if mode=='live' else supported) if cli=='all' else [cli]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('matrix='+json.dumps(selected),file=f)
          PY
  trial:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCH_CLI: ${{ matrix.cli }}
      BENCH_MODEL: ${{ inputs.model }}
      BENCH_MODE: ${{ inputs.mode == 'smoke' && 'fixture' || inputs.mode }}
      SERIES: ${{ inputs.series }}
      GAME: ${{ inputs.game }}
      PHASE: ${{ inputs.phase }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests

      - if: matrix.cli == 'cursor' && inputs.mode == 'smoke'
        run: |
          python -m production.build --series worlds-2026-main-event-quarterfinals-4 --game 2 --phase draft-lock
          python -m evaluation.cli.worker cursor "$BENCH_MODEL" check tasks/*/environment/snapshot.json tasks/*/instruction.md output
          cat output/run.json
      - if: matrix.cli != 'cursor' || inputs.mode != 'smoke'
        run: pip install -q harbor==0.25.0
      - if: matrix.cli != 'cursor' || inputs.mode != 'smoke'
        env:
          DEEPSEEK_API_KEY: ${{ inputs.mode == 'live' && secrets.BENCH_DEEPSEEK_KEY || '' }}
          CURSOR_API_KEY: ${{ inputs.mode == 'vendor' && secrets.BENCH_CURSOR_KEY || '' }}
        run: |
          args=(--harness "$BENCH_CLI" --model "$BENCH_MODEL" --mode "$BENCH_MODE" --out output)
          if [[ "$SERIES" != "*" ]]; then args+=(--series "$SERIES"); fi
          if [[ "$GAME" != 0 ]]; then args+=(--game "$GAME"); fi
          if [[ "$PHASE" != both ]]; then args+=(--phase "$PHASE"); fi
          if [[ -n "$LIMIT" ]]; then args+=(--limit "$LIMIT"); fi
          if [[ "$SERIES" = "*" && "$GAME" = 0 && "$PHASE" = both && -z "$LIMIT" ]]; then
            args+=(--all)
          fi
          ./bench e2e "${args[@]}"
          if [[ "$BENCH_MODE" = fixture ]]; then
            python -c 'import json; r=json.load(open("output/report.json")); assert all(t["prediction"]=={"p_blue_win":0.41,"p_blue_ahead_15":0.57} for t in r["trials"])'
          fi
      - if: inputs.mode == 'smoke' && matrix.cli != 'cursor'
        name: Verify the Harbor gateway captured the model context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from evaluation.model_context import model_context
          root = Path("output")
          for trial in json.loads((root / "report.json").read_text())["trials"]:
              path = root / trial["trajectory"]["files"]["context"]
              calls = model_context(path)["calls"]
              assert calls and all(c["source"] == "fixture" for c in calls)
              assert any(c["complete"] and c["status"] == 200 for c in calls)
              for c in calls:
                  model_context(path, c["id"])
          PY
      - if: inputs.mode == 'smoke'
        name: Check hidden facts and allowed history from the CLI worker
        run: ./bench boundary --harness "$BENCH_CLI" --out output/boundary
      - if: matrix.cli == 'codex' && inputs.mode == 'smoke'
        name: Forecast and seal an unlabeled draft fixture
        run: PYTHONPATH="$PWD" python tests/harbor_pending_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli }}-${{ inputs.mode }}-${{ inputs.phase }}
          path: |
            output/*.json
            output/report.md
            output/traces/
            output/jobs/**/agent/cli-events.log
            output/jobs/**/agent/stderr.txt
            output/jobs/**/agent/cli-run.json
            output/jobs/**/artifacts/app/prediction.json
            output/boundary/
            !output/**/model-context.jsonl
          retention-days: 7
      - if: always()
        run: |
          test -z "$(docker ps -aq --filter name=lolbench-)"
          test -z "$(docker volume ls -q --filter name=lolbench-)"
          test -z "$(docker image ls -q 'lolbench-*')"
